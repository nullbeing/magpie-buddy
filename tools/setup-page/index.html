<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Magpie Buddy — set up</title>
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --line: #e3e3e8;
    --fg: #1c1c21;
    --fg2: #4b4b53;
    --muted: #85858d;
    --field: #f7f7f9;
    --accent: #5b5bd6;
    --accent-fg: #ffffff;
    --ok: #189a58;
    --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0e;
      --card: #15181c;
      --line: #262b32;
      --fg: #f0f2f5;
      --fg2: #98a0ac;
      --muted: #6b7480;
      --field: #1e2228;
      --accent: #8b86ff;
      --accent-fg: #0b0c0e;
      --ok: #3add94;
      --bad: #e05252;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 40px;
    min-height: 100vh;
  }
  main { max-width: 420px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--fg); color: var(--bg);
    display: grid; place-items: center;
    font-weight: 700; font-size: 15px; letter-spacing: -.02em;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 650; }
  header p { margin: 0; color: var(--fg2); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .card + .card { margin-top: 12px; }

  .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px 11px;
    font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted);
  }
  .head button {
    font: inherit; letter-spacing: .04em;
    background: none; border: 0; color: var(--accent);
    padding: 4px 2px; cursor: pointer;
  }

  .nets { border-top: 1px solid var(--line); }
  .net {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 16px; min-height: 50px;
    background: none; border: 0; border-top: 1px solid var(--line);
    color: var(--fg); font: inherit; text-align: left; cursor: pointer;
  }
  .net:first-child { border-top: 0; }
  .net:active { background: var(--field); }
  .net .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net .lock { color: var(--muted); font-size: 12px; flex: none; }
  .net.on { background: var(--field); }
  .net.on .name { font-weight: 600; }
  .empty { padding: 18px 16px; color: var(--muted); }

  .bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
  .bars i { width: 3px; border-radius: 1px; background: var(--line); }
  .bars i:nth-child(1) { height: 5px; }
  .bars i:nth-child(2) { height: 9px; }
  .bars i:nth-child(3) { height: 14px; }
  .bars i.on { background: var(--fg2); }

  form { padding: 16px; }
  form.hidden { display: none; }
  label { display: block; font-size: 13px; color: var(--fg2); margin-bottom: 9px; }
  label b { color: var(--fg); font-weight: 600; }
  input {
    width: 100%; padding: 13px 14px; font: inherit;
    color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    width: 100%; margin-top: 12px; padding: 14px;
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .45; cursor: default; }

  /* The stored network, and the way out of it. A button that throws something
     away is drawn as text in the danger colour rather than filled, so it is
     never the thing a thumb lands on by accident. */
  .cur { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .cur .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .cur button {
    font: inherit; font-size: 13.5px; font-weight: 600;
    background: none; border: 1px solid var(--line); border-radius: 9px;
    color: var(--bad); padding: 8px 13px; cursor: pointer; flex: none;
  }
  .cur button:active { background: var(--field); }
  .cur button:disabled { opacity: .45; cursor: default; }
  .card.hidden { display: none; }

  details summary {
    padding: 14px 16px; cursor: pointer; color: var(--fg2); font-size: 14px;
    list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { color: var(--fg); }
  details form { padding-top: 0; }

  .msg { margin: 14px 2px 0; font-size: 14px; color: var(--fg2); min-height: 1.4em; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .foot { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark">MB</div>
    <h1>Magpie Buddy</h1>
    <p>Connect this display to your Wi‑Fi.</p>
  </header>

  <section class="card hidden" id="current">
    <div class="head">
      <span>Current network</span>
    </div>
    <div class="cur">
      <span class="name" id="curName">—</span>
      <button id="forget" type="button">Forget</button>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <span>Networks</span>
      <button id="rescan" type="button">Rescan</button>
    </div>
    <div class="nets" id="nets">
      <div class="empty">Scanning…</div>
    </div>
  </section>

  <form class="card hidden" id="join" autocomplete="on">
    <label>Password for <b id="ssid">—</b></label>
    <input id="pass" type="password" name="password" autocomplete="current-password"
           autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Network password">
    <button class="primary" id="go" type="submit">Connect</button>
  </form>

  <details class="card">
    <summary>Hidden network</summary>
    <form id="manual" autocomplete="on">
      <label for="hssid">Network name</label>
      <input id="hssid" name="ssid" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="SSID">
      <label for="hpass" style="margin-top:12px">Password</label>
      <input id="hpass" name="password" type="password" autocomplete="current-password" placeholder="Network password">
      <button class="primary" type="submit">Connect</button>
    </form>
  </details>

  <p class="msg" id="msg"></p>
  <p class="foot">2.4 GHz networks only — the ESP32 has no 5 GHz radio.</p>
</main>

<script>
const $ = (s) => document.querySelector(s);
const msg = (t, cls) => { const m = $("#msg"); m.textContent = t || ""; m.className = "msg" + (cls ? " " + cls : ""); };
let chosen = null;

function bars(rssi) {
  // -50 or better is three bars, -70 two, weaker one
  const n = rssi >= -55 ? 3 : rssi >= -70 ? 2 : 1;
  return '<span class="bars">' + [0, 1, 2].map(i => '<i class="' + (i < n ? "on" : "") + '"></i>').join("") + "</span>";
}

function render(list) {
  const box = $("#nets");
  if (!list || !list.length) { box.innerHTML = '<div class="empty">No networks found. Try again, or add a hidden one below.</div>'; return; }
  box.innerHTML = list.map((n, i) =>
    '<button class="net" type="button" data-i="' + i + '">' +
      bars(n.rssi) +
      '<span class="name">' + n.ssid.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])) + '</span>' +
      (n.secure ? '<span class="lock">locked</span>' : "") +
    "</button>").join("");
  box.querySelectorAll(".net").forEach(b => b.onclick = () => pick(list[+b.dataset.i]));
}

function pick(n) {
  chosen = n;
  document.querySelectorAll(".net").forEach(el => el.classList.remove("on"));
  document.querySelectorAll(".net").forEach(el => {
    if (el.querySelector(".name").textContent === n.ssid) el.classList.add("on");
  });
  $("#ssid").textContent = n.ssid;
  $("#join").classList.remove("hidden");
  msg("");
  if (!n.secure) { $("#pass").value = ""; $("#pass").placeholder = "No password needed"; }
  else { $("#pass").placeholder = "Network password"; }
  $("#pass").focus({ preventScroll: true });
  $("#join").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function scan() {
  $("#nets").innerHTML = '<div class="empty">Scanning…</div>';
  try {
    const r = await fetch("/scan");
    render(await r.json());
  } catch (e) {
    $("#nets").innerHTML = '<div class="empty">Scan failed. Try Rescan.</div>';
  }
}

async function save(ssid, pass) {
  msg("Connecting…");
  $("#go").disabled = true;
  try {
    const r = await fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "ssid=" + encodeURIComponent(ssid) + "&password=" + encodeURIComponent(pass)
    });
    if (!r.ok) throw new Error(await r.text());
    msg("Saved. The display is joining “" + ssid + "”.", "ok");
  } catch (e) {
    msg(String(e.message || e), "err");
    $("#go").disabled = false;
  }
}

$("#rescan").onclick = scan;

// The stored network. Asked once on load: this page is reached from a phone
// that has just joined the board, and "which network does it think it is on"
// is the first thing worth knowing before changing anything.
async function state() {
  try {
    const r = await fetch("/state");
    const s = await r.json();
    if (s.saved && s.ssid) {
      $("#curName").textContent = s.ssid;
      $("#current").classList.remove("hidden");
    } else {
      $("#current").classList.add("hidden");
    }
    return s;
  } catch (e) {
    return { saved: false };
  }
}

// Forgetting keeps the board where it is — still an access point, still serving
// this page — so the next network can be picked without a reboot dropping the
// page mid-tap.
$("#forget").onclick = async () => {
  const name = $("#curName").textContent;
  $("#forget").disabled = true;
  try {
    const r = await fetch("/forget", { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    $("#current").classList.add("hidden");
    msg("“" + name + "” forgotten. Pick the network to use instead.", "ok");
    scan();
  } catch (e) {
    msg(String(e.message || e), "err");
    $("#forget").disabled = false;
  }
};
$("#join").onsubmit = (e) => { e.preventDefault(); if (chosen) save(chosen.ssid, $("#pass").value); };
$("#manual").onsubmit = (e) => { e.preventDefault(); const s = $("#hssid").value.trim(); if (s) save(s, $("#hpass").value); };
scan();
state();
</script>
</body>
</html>
