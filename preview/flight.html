<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>magpie · CoreS3 预览 320×240</title>
<style>
  :root {
    --bg: #0e1013; --card: #171b21; --line: #262c35; --fg: #e8eaed;
    --muted: #8b93a1; --red: #ef4444; --accent: #e8eaed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #07080a; color: var(--fg);
    font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  }
  .wrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  /* the board's own frame: 320x240, 2x for a retina preview */
  .device {
    width: 640px; height: 480px; border-radius: 14px; overflow: hidden;
    background: var(--bg); box-shadow: 0 0 0 1px #2a2f38, 0 24px 60px #000c;
    position: relative;
  }
  .device svg { width: 100%; height: 100%; display: block; }
  .side { width: 380px; display: flex; flex-direction: column; gap: 10px; }
  .side h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .side p { margin: 0; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
    background: #1c2229; color: var(--fg); border: 1px solid #2c333d;
  }
  button:hover { background: #232b34; }
  button:active { transform: translateY(1px); }
  button.on { background: #e8eaed; color: #0e1013; border-color: #e8eaed; }
  textarea {
    width: 100%; height: 150px; resize: vertical; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #10141a; color: #c9d1d9; border: 1px solid #262c35; border-radius: 8px; padding: 9px;
  }
  .log { height: 78px; overflow: auto; font: 11px/1.6 ui-monospace, Menlo, monospace;
         background: #10141a; border: 1px solid #262c35; border-radius: 8px; padding: 8px; color: var(--muted); }
  .log b { color: var(--fg); font-weight: 500; }

  /* ---- the bird: wings beat from the shoulder, far wing a beat behind ---- */
  .flier .wing { transform-box: fill-box; transform-origin: 50% 100%;
                 animation: flap .42s cubic-bezier(.45, 0, .3, 1) infinite; }
  .flier .wing.far { animation-delay: -.03s; opacity: .45; }
  @keyframes flap { 0%, 100% { transform: scaleY(1); } 55% { transform: scaleY(-.62) skewX(-8deg); } }
  .flier .lift { animation: come .3s ease-out; transition: opacity .35s; }
  .flier.away .lift { opacity: 0; }
  @keyframes come { from { opacity: 0; } }
  .flier .body, .flier .tail, .flier .wing path:first-child, .flier .wing.far { fill: currentColor; }
  .flier .belly { fill: var(--bg); }
  .flier .bar { fill: none; stroke: var(--bg); stroke-width: 1.3; stroke-linecap: round; }
  .pkt.held { animation: held 1.2s ease-in-out infinite; }
  @keyframes held { 50% { opacity: .4; } }
  .hit { animation: hit .5s ease-out; }
  @keyframes hit { 0% { stroke-width: 6; } 100% { stroke-width: 1.5; } }
  @media (prefers-reduced-motion: reduce) {
    .flier .wing { animation: none; }
    .pkt.held { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="device"><svg id="scr" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet"></svg></div>

  <div class="side">
    <h1>magpie · CoreS3 桌面牌</h1>
    <p>320×240 的预览，也是固件的设计稿。飞行动画复现 magpie Routing 页的编排：请求 → magpie → 座位，放鸟等待，应答飞回；失败先回 magpie 再换下一站。</p>
    <div class="row">
      <button id="play" class="on">演示</button>
      <button id="ok">成功</button>
      <button id="fail">失败后重试</button>
      <button id="stop">停</button>
    </div>
    <p>粘一帧真实推送（<code>magpie plugin dump display</code> 或抓包），点「喂一帧」：</p>
    <textarea id="frame" spellcheck="false" placeholder='{"v":1,"seq":1,"now":0,"up":1,"r":{...}}'></textarea>
    <div class="row">
      <button id="feed">喂一帧</button>
      <button id="sample">填一帧样例</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// This file is the design reference for the firmware: every number here is a
// number the ESP32 has to draw. It is deliberately dependency-free and uses
// only what LVGL can also do (arcs, rounded rects, lines, one glyph).
// ---------------------------------------------------------------------------

const NS = "http://www.w3.org/2000/svg";
const W = 320, H = 240;
const scr = document.getElementById("scr");
const el = (n, a = {}) => {
  const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]);
  return e;
};

// --- palette: the window's own dark theme, so the desk matches the screen ---
const C = { bg: "#0e1013", card: "#171b21", line: "#262c35", fg: "#e8eaed", muted: "#8b93a1", red: "#ef4444" };

// an agent's colour: its maker's, else one of the spares by its id — never red,
// which on this screen means a failure (magpie's routing hueOf, same table)
const HUES = {
  claude: "#d97757", codex: "#6366f1", gemini: "#0ea5e9", copilot: "#a855f7",
  cursor: "#14b8a6", opencode: "#eab308", crush: "#ec4899", goose: "#84cc16",
  pi: "#10b981", omp: "#d946ef", omo: "#7c3aed", dsh: "#06b6d4",
  commandcode: "#f97316", mimocode: "#3b82f6", deveco: "#3c99cc",
};
const SPARE = ["#8b5cf6", "#22c55e", "#0d9488", "#0891b2", "#ca8a04", "#db2777", "#2563eb", "#65a30d"];
function hueOf(id) {
  if (HUES[id]) return HUES[id];
  let h = 0;
  for (const c of String(id || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return SPARE[h % SPARE.length];
}

// the magpie, drawn to fly: facing right, the dot it carries at the tip of its
// beak; its wings beat from the shoulder. The same path magpie's Routing page
// uses (internal/gui/assets/plugins/routing/client.js, FLIER).
const FLIER = '<g class="lift"><g transform="scale(0.9) translate(-6.5 3.2)">'
  + '<path class="wing far" d="M-14.5 -3.4C-16.5 -9.5 -14.2 -15 -8.6 -18.6C-9.4 -12.6 -9.6 -7.4 -9.2 -3.2Z"/>'
  + '<path class="tail" d="M-31.5 3.1L-18.6 -1.8L-17.4 1.2L-30.8 4.6Z"/>'
  + '<ellipse class="body" cx="-12.2" cy="-1.4" rx="7.6" ry="3.9"/>'
  + '<ellipse class="belly" cx="-12.8" cy="0.4" rx="4.3" ry="1.6"/>'
  + '<circle class="body" cx="-4.9" cy="-3.7" r="3.1"/>'
  + '<path class="body" d="M-2.3 -4.8L1.4 -3.3L-2.3 -2.2Z"/>'
  + '<g class="wing near"><path d="M-15.6 -3.2C-17.8 -10.2 -15.2 -16.4 -8.4 -20.4C-9.3 -13.6 -9.4 -7.8 -8.8 -2.8Z"/>'
  + '<path class="bar" d="M-14.6 -5.6C-15.4 -10.4 -13.8 -14.4 -10.4 -17.2"/></g>'
  + "</g></g>";

// --- layout: three columns, the flight stage across them -------------------
const L = {
  header: { y: 0, h: 22 },
  stage: { x: 6, y: 26, w: 308, h: 122 },
  agent: { x: 32, y: 84 },   // the agent's node: left
  hub:   { x: 160, y: 84 },  // magpie: middle
  seat:  { x: 288, y: 84 },  // who answers: right
  ctx:   { cx: 46, cy: 194, r: 25 },
  use:   { x: 86, y: 172 },

};

// --- the screen ------------------------------------------------------------
const gBack = el("g"), gWires = el("g"), gSky = el("g"), gHud = el("g");
scr.append(gBack, gWires, gSky, gHud);

const wires = {
  in:  el("path", { fill: "none", stroke: C.line, "stroke-width": 1.5 }),

};
gWires.append(wires.in, wires.out);

// the hub: a rounded square with the magpie's own bird glyph, like the page's

const hubG = el("g");
const hubBox = el("rect", { x: L.hub.x - 16, y: L.hub.y - 16, width: 32, height: 32, rx: 10,

const hubBird = el("g", { transform: `translate(${L.hub.x - 11} ${L.hub.y - 11}) scale(0.5)`, fill: C.fg });
// the magpie mark, from index.html's #bird path, cut to the body alone so it
// reads at 22px: no wings, no animation — the flying ones are elsewhere
hubBird.innerHTML = '<path fill-rule="evenodd" d="M1.5 5.5C1.3 5.7 1.2 6.5 1.2 6.9C1.2 6.9 1.2 7 1.2 7.1C1.1 7.4 1.3 8 1.4 8.3C1.4 8.4 1.5 8.5 1.5 8.7C1.5 8.9 1.7 9 1.8 9.3C2.2 9.9 2.2 10 2.3 10.1C2.4 10.2 2.5 10.3 2.6 10.5C2.8 10.8 3 11.1 3.2 11.3C3.3 11.3 3.4 11.6 3.6 11.8C3.8 12 4.1 12.4 4.2 12.5C4.7 13 5.2 13.7 5.4 13.9C6 14.5 6.5 15.1 6.7 15.3C6.7 15.4 6.9 15.5 6.9 15.7C7.3 15.9 7.7 16.5 7.9 16.8C8 16.9 8.1 16.9 8.2 17.2C8.2 17.3 8.1 17.2 8.1 17.1C7.9 16.9 7.9 16.9 7.6 16.6C7.5 16.5 7.4 16.5 7.4 16.3C7.2 16.2 6.7 15.7 6.3 15.2C6.1 15.1 6 14.9 6 14.9C5.9 14.8 5.7 14.7 5.7 14.6C5.6 14.5 5.4 14.3 5.3 14.2C5.1 14.1 4.9 13.8 4.7 13.5C4.5 13.3 4.2 13.1 4.1 12.9C4.1 12.9 3.8 12.7 3.8 12.5C3.5 12.3 3 11.8 2.8 11.4C1.8 10.5 0.9 9.6 0.7 9.6C0.6 9.7 0.6 9.8 0.5 10C0.5 10.1 0.6 10.2 0.5 10.3C0.5 10.4 0.6 10.5 0.6 10.6C0.5 10.7 0.5 10.9 0.6 11C0.5 11.1 0.6 11.4 0.6 11.5C0.9 12.9 1.3 13.8 2.8 14.9C2.9 15.1 3.3 15.3 3.4 15.4C3.4 15.5 3.6 15.6 3.7 15.7C4.2 16 6.4 17.8 7 18.4C7.4 18.8 7.4 18.8 7.5 18.9C7.6 19 7.7 19 7.7 19.1C7.7 19.2 7.8 19.2 7.9 19.2C7.9 19.3 8.1 19.4 8.1 19.5C8.2 19.6 8.2 19.7 8.3 19.7C8.3 19.7 8.3 19.7 8.2 19.7C8.2 19.6 8.1 19.6 8 19.6C7.9 19.5 7.9 19.4 7.8 19.4C7.7 19.3 7.6 19.2 7.6 19.2C7.6 19.1 7.5 19 7.3 18.9C7.2 18.9 6.9 18.6 6.7 18.4C6.1 17.8 4.5 16.6 3.5 16C3.4 15.8 3 15.6 2.9 15.5C2.6 15.3 1.5 14.6 0.9 14.3C0.7 14.1 0.6 14.1 0.6 14.2C0.5 14.5 0.8 15.9 0.9 16.1C0.9 16.2 1 16.2 0.9 16.3C1.2 16.8 1.9 17.6 2.7 18.3C2.8 18.5 4 19.2 4.7 19.5C6.2 20.5 6.6 20.7 7.4 21.5C8.2 22.2 8.7 22.7 9.3 23.6C9.5 24.1 9.9 24.4 10.3 25.3C10.4 25.5 10.5 25.8 10.5 25.8C10.7 25.8 10.8 25.7 11 25.4C11.6 25 11.9 24.6 12.3 24.3C12.8 24 13 23.8 13 23.7C13.1 23.7 13.1 23.8 13 24C12 24.8 11 26 10.2 26.9C10.1 27.1 9.9 27.5 9.7 27.7C9.5 27.8 9.4 28 9.4 28C9.4 28 9.3 28.3 9.1 28.5C8.6 29.2 7.7 30.8 7.7 30.9C7.7 31 7.8 31 8.3 30.8C9 30.4 9.5 30.2 10.4 30C11.7 29.6 12.5 29.6 11.6 30C10.5 30.2 9.7 30.6 9.2 31.2C8.8 31.7 8.8 31.7 9.3 31.7C10.1 31.8 10.9 31.9 11.6 32.2C12.8 32.7 13.5 33.1 hubG.append(hubBox, hubBird);
gBack.append(hubG);

// the agent node and the seat node are drawn once and relabelled per frame
function node() {
  const g = el("g");
  const box = el("rect", { width: 46, height: 34, rx: 8, fill: C.card, stroke: C.line, "stroke-width": 1 });
  const dot = el("circle", { r: 3.5, cx: 23, cy: 10 });
  const name = el("text", { x: 23, y: 24, "text-anchor": "middle", fill: C.fg,
    "font-size": 8.5, "font-weight": 600, "font-family": "inherit" });
  g.append(box, dot, name);
  gBack.append(g);
  return { g, box, dot, name };
}
const agentN = node(), seatN = node();

// --- text helper: LVGL has no ellipsis, so every label is cut here too -----
function fit(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

const hud = {};
function hudText(id, x, y, size, fill, anchor = "start", weight = 400) {
  const t = el("text", { x, y, fill, "font-size": size, "text-anchor": anchor,
    "font-family": "inherit", "font-weight": weight });
  gHud.append(t);
  hud[id] = t;
  return t;
}

// header: who asked, and what answered
hudText("agent", 10, 15, 10, C.fg, "start", 600);
hudText("model", 310, 15, 9.5, C.muted, "end");
hudText("group", 310, 26, 8, C.muted, "end");

// the context arc: 26px radius, 8px wide, from 135° to 405° (three quarters)
const ARC = { from: 135, to: 405 };
const arcBg = el("path", { fill: "none", stroke: C.line, "stroke-width": 7, "stroke-linecap": "round" });
const arcFg = el("path", { fill: "none", stroke: C.fg, "stroke-width": 7, "stroke-linecap": "round" });
gHud.append(arcBg, arcFg);
function arcPath(cx, cy, r, a0, a1) {
  const p = (a) => { const t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}
hudText("ctxPct", L.ctx.cx, L.ctx.cy + 3, 12, C.fg, "middle", 600);
hudText("ctxTok", L.ctx.cx, L.ctx.cy + 14, 7, C.muted, "middle");

// today
hudText("useHead", L.use.x, L.use.y, 7.5, C.muted, "start", 600);
hudText("useVal", L.use.x, L.use.y + 15, 12, C.fg, "start", 600);
hudText("useSub", L.use.x, L.use.y + 28, 7.5, C.muted, "start");
hudText("useCost", L.use.x, L.use.y + 40, 7.5, C.muted, "start");

// quotas: up to three bars, the tightest first
hudText("qHead", L.cards.x, L.cards.y - 6, 7.5, C.muted, "start", 600);
const qRows = [];
for (let i = 0; i < 3; i++) {
  const y = L.cards.y + i * L.cards.gap;
  const label = el("text", { x: L.cards.x, y: y + 6, fill: C.muted, "font-size": 7.5, "font-family": "inherit" });
  const track = el("rect", { x: L.cards.x, y: y + 9, width: L.cards.w, height: 4, rx: 2, fill: C.line });
  const fill = el("rect", { x: L.cards.x, y: y + 9, width: 0, height: 4, rx: 2, fill: C.fg });
  const pct = el("text", { x: L.cards.x + L.cards.w, y: y + 6, fill: C.fg, "font-size": 7.5,
    "text-anchor": "end", "font-family": "inherit" });
  gHud.append(label, track, fill, pct);
  qRows.push({ label, track, fill, pct });
}

// offline banner, drawn over everything when the frames stop
const offG = el("g", { opacity: 0 });
const offBox = el("rect", { x: 6, y: 26, width: 308, height: 122, rx: 10, fill: C.bg, opacity: .92 });
const offTxt = el("text", { x: 160, y: 92, fill: C.red, "font-size": 13, "text-anchor": "middle",
  "font-family": "inherit", "font-weight": 600 });
offTxt.textContent = "magpie 离线";
const offSub = el("text", { x: 160, y: 108, fill: C.muted, "font-size": 8.5, "text-anchor": "middle", "font-family": "inherit" });
offSub.textContent = "没有帧 · 15s 心跳已断";
offG.append(offBox, offTxt, offSub);
gHud.append(offG);

// --- geometry: where a flight goes -----------------------------------------
// The stage is three points, and a wire from the agent to the hub and the hub
// to the seat: the same shape as magpie's Routing page, laid out for 320x240.
function layout() {
  const a = { x: L.agent.x, y: L.agent.y }, h = L.hub, s = { x: L.seat.x, y: L.seat.y };
  agentN.g.setAttribute("transform", `translate(${a.x - 23} ${a.y - 17})`);
  seatN.g.setAttribute("transform", `translate(${s.x - 23} ${s.y - 17})`);
  // the wires bow out of the nodes, as the page's do
  wires.in.setAttribute("d", `M${a.x + 23} ${a.y} C${(a.x + 23 + h.x - 15) / 2} ${a.y} ${(a.x + 23 + h.x - 15) / 2} ${h.y} ${h.x - 15} ${h.y}`);
  wires.out.setAttribute("d", `M${h.x + 15} ${h.y} C${(h.x + 15 + s.x - 23) / 2} ${h.y} ${(h.x + 15 + s.x - 23) / 2} ${s.y} ${s.x - 23} ${s.y}`);
}

// a flight is a list of legs: each a path, and whether it is flown backwards
// (the reply comes home the way the request went, against the wire)
const legs = {
  toHub:   () => [{ p: wires.in }],
  toSeat:  () => [{ p: wires.out }],
  backHub: () => [{ p: wires.out, rev: true }],
  toAgent: () => [{ p: wires.in, rev: true }],
};

const pose = (() => {
  let raf = 0, trips = [];
  function at(p, rev, d) {
    const L2 = p.getTotalLength?.() || 0;
    if (!L2) return null;
    return p.getPointAtLength(rev ? L2 - d : d);
  }
  // pose puts a flight's dot e of the way along, and its magpie with it,
  // heading the way it flies — turned about to fly left, tilted no more than a
  // bird banks. This is magpie's pose(), and the firmware's heading rule.
  function draw(tr, e) {
    const lens = tr.legs.map((l) => l.p.getTotalLength?.() || 0);
    const total = lens.reduce((x, y) => x + y, 0);
    if (!total) return;
    let d = e * total, i = 0;
    while (i < lens.length - 1 && d > lens[i]) { d -= lens[i]; i++; }
    const l = tr.legs[i];
    const pt = at(l.p, l.rev, d);
    if (!pt) return;
    tr.dot.setAttribute("cx", pt.x); tr.dot.setAttribute("cy", pt.y);
    tr.dot.removeAttribute("visibility");
    const b = tr.bird;
    if (!b) return;
    const p0 = at(l.p, l.rev, Math.max(0, d - 3)), p1 = at(l.p, l.rev, Math.min(lens[i], d + 3));
    let vx = p1.x - p0.x, vy = p1.y - p0.y;
    if (Math.abs(vx) + Math.abs(vy) < .01) { vx = b._vx ?? (l.rev ? -1 : 1); vy = 0; }
    b._vx = vx;
    const aim = Math.max(-24, Math.min(24, Math.atan2(vy, Math.abs(vx)) * 180 / Math.PI));
    b._a = b._a === undefined || b._flip !== (vx < 0) ? aim : b._a + (aim - b._a) * .12;
    b._flip = vx < 0;
    b.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) scale(${b._flip ? -1 : 1} 1) rotate(${b._a.toFixed(1)})`);
  }
  function tick() {
    raf = 0;
    const now = performance.now();
    trips = trips.filter((tr) => {
      const e = tr.ms ? Math.min(1, (now - tr.t0) / tr.ms) : 1;
      draw(tr, e);
      if (e >= 1) { tr.res(); return false; }
      return true;
    });
    if (trips.length) raf = requestAnimationFrame(tick);
  }
  return {
    fly(dot, bird, list, ms) {
      return new Promise((res) => {
        const tr = { dot, bird, legs: list, t0: performance.now(), ms: still() ? 0 : ms, res };
        draw(tr, 0);
        trips.push(tr);
        if (!raf) raf = requestAnimationFrame(tick);
      });
    },
    stop() { trips = []; if (raf) cancelAnimationFrame(raf); raf = 0; },
  };
})();

const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, still() ? 0 : ms));

function bird(cls) {
  const g = el("g", { class: "flier " + cls });
  g.innerHTML = FLIER;
  gSky.appendChild(g);
  return g;
}
function away(b) {
  if (!b) return;
  b.classList.add("away");
  setTimeout(() => b.remove(), 400);
}
function packet() {
  const dot = el("circle", { r: 3.6, class: "pkt", visibility: "hidden" });
  gSky.appendChild(dot);
  return dot;
}

// --- the frame's state, and what it draws ---------------------------------
let state = blank();
let gen = 0;

function blank() {
  return { v: 1, seq: 0, now: 0, up: 1, r: null, c: null, u: null, q: [] };
}

function apply(f) {
  // a frame older than the one on screen is dropped, as the firmware does
  if (f.seq && f.seq < state.seq) return false;
  state = f;
  paint();
  return true;
}

function paint() {
  const f = state, r = f.r || {}, c = f.c || {}, u = f.u || {};
  const hue = hueOf(r.agent);

  agentN.dot.setAttribute("fill", hue);
  agentN.name.textContent = fit(r.agent || "—", 7);
  agentN.box.setAttribute("stroke", r.id ? hue : C.line);
  seatN.name.textContent = fit(r.provider || "—", 8);
  seatN.dot.setAttribute("fill", r.fail ? C.red : r.done ? C.muted : C.fg);
  seatN.box.setAttribute("stroke", r.fail ? C.red : r.done ? C.line : C.fg);

  hud.agent.textContent = fit(r.agent || "等待第一个请求", 14);
  hud.agent.setAttribute("fill", hue);
  hud.model.textContent = r.model ? fit(r.provider + "/" + r.model, 26) : "";
  hud.group.textContent = r.group ? fit("组 " + r.group, 24) : "";

  // the context arc: what the prompt holds against the model's window. With
  // no window known it is a plain ring, never an invented fraction.
  const pct = c.win ? Math.min(1, c.tok / c.win) : 0;
  arcBg.setAttribute("d", arcPath(L.ctx.cx, L.ctx.cy, L.ctx.r, ARC.from, ARC.to));
  const sweep = (ARC.to - ARC.from) * pct;
  arcFg.setAttribute("d", sweep > 0.5 ? arcPath(L.ctx.cx, L.ctx.cy, L.ctx.r, ARC.from, ARC.from + sweep) : "M0 0");
  arcFg.setAttribute("stroke", pct >= .9 ? C.red : pct >= .7 ? "#eab308" : C.fg);
  hud.ctxPct.textContent = c.win ? Math.round(pct * 100) + "%" : "—";
  hud.ctxTok.textContent = c.tok ? kfmt(c.tok) : "";

  hud.useHead.textContent = "今天";
  hud.useVal.textContent = u.req != null ? u.req + " 次" : "—";
  hud.useSub.textContent = u.tok ? kfmt(u.tok) + " tok" + (u.err ? " · " + u.err + " 错" : "") : "";
  hud.useCost.textContent = u.cost != null ? "$" + u.cost.toFixed(2) : "";

  const q = (f.q || []).slice(0, 3);
  qRows.forEach((row, i) => {
    const card = q[i];
    const show = !!card;
    for (const k of ["label", "track", "fill", "pct"]) row[k].setAttribute("opacity", show ? 1 : 0);
    if (!show) return;
    row.label.textContent = fit(card.n, 12);
    row.fill.setAttribute("width", Math.max(0, Math.min(100, card.left)) / 100 * L.cards.w);
    row.fill.setAttribute("fill", card.left <= 15 ? C.red : card.left <= 35 ? "#eab308" : C.fg);
    row.pct.textContent = card.left + "%";
  });
}

function kfmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}

// --- playing a route: the state machine, in one place ---------------------
// This is the whole choreography, and it is what the firmware implements:
//
//   1. the request leaves the agent, flies to magpie            1400ms
//   2. magpie hands it on to the seat it picked                  900ms
//   3. the bird lets go; the dot waits there while it answers
//   4. answered: the dot comes home the way it went             1400ms
//      failed, and the routing will try again: back to magpie    620ms
//      failed, and that was the answer: home, red               1350ms
async function play(frame) {
  const r = frame.r;
  if (!r) return;
  const g = ++gen;
  const hue = hueOf(r.agent);
  const dot = packet();
  dot.setAttribute("fill", hue);
  dot.style.filter = `drop-shadow(0 0 3px ${hue})`;

  let carrier = bird("req");
  carrier.style.color = C.fg;

  try {
    // 1 + 2: the request, one flight through the hub
    await pose.fly(dot, carrier, [...legs.toHub(), ...legs.toSeat()], r.moved ? 900 : 1400);
    if (g !== gen) return;

    // 3: let go, and wait
    away(carrier); carrier = null;
    dot.classList.add("held");
    seatN.g.classList.add("hit");
    setTimeout(() => seatN.g.classList.remove("hit"), 500);
    await wait(still() ? 0 : 900);
    if (g !== gen) return;
    dot.classList.remove("held");

    // 4: the answer
    dot.classList.add("back");
    dot.setAttribute("fill", C.bg);
    dot.setAttribute("stroke", r.fail ? C.red : hue);
    dot.setAttribute("stroke-width", 2);
    const back = bird("res");
    back.style.color = r.fail ? C.red : C.fg;

    if (r.fail && !r.done) {
      // back to magpie, which hands it on to the next
      await pose.fly(dot, back, legs.backHub(), 620);
      if (g !== gen) return;
      away(back);
      dot.classList.remove("back");
      dot.removeAttribute("stroke");
      dot.setAttribute("fill", hue);
      // and out again to the next seat, as the next frame's try will say
      const next = bird("req");
      await pose.fly(dot, next, legs.toSeat(), 900);
      away(next);
      if (g === gen) dot.remove();
      return;
    }
    await pose.fly(dot, back, legs.toAgent(), r.fail ? 1350 : 1400);
    if (g !== gen) return;
    away(back);
    agentN.g.classList.add("hit");
    setTimeout(() => agentN.g.classList.remove("hit"), 500);
  } finally {
    away(carrier);
    dot.remove();
    if (g === gen) setTimeout(() => { /* nothing left flying */ }, 0);
  }
}

// --- the demo: a fake stream, so the screen can be seen without magpie ----
const logEl = document.getElementById("log");
function say(s) {
  const b = document.createElement("b");
  b.textContent = "· ";
  logEl.appendChild(b);
  logEl.appendChild(document.createTextNode(s + "\n"));
  logEl.scrollTop = logEl.scrollHeight;
}

let seq = 0;
function frame(over = {}) {
  seq++;
  return Object.assign({
    v: 1, seq, now: Math.floor(Date.now() / 1000), up: 1,
    c: { tok: 48213, win: 200000, cache: 44000, out: 1204 },
    u: { req: 37, tok: 1240000, err: 1, cost: 2.41 },
    q: [
      { n: "Claude 5h", left: 62, at: 4300 },
      { n: "Codex 7d", left: 18, at: 172800 },
      { n: "Kimi 月", left: 84, at: 900000 },
    ],
  }, over);
}

let demoOn = false;
const demoTimers = [];
function later(ms, fn) { demoTimers.push(setTimeout(fn, ms)); }
function stopDemo() {
  demoOn = false;
  while (demoTimers.length) clearTimeout(demoTimers.pop());
  gen++;
  pose.stop();
  gSky.replaceChildren();
}

async function demo() {
  stopDemo();
  demoOn = true;
  say("开始演示");
  const ok = frame({ r: { id: 1, agent: "claude", provider: "kimi", model: "kimi-k2.5",
    group: "opus-anywhere", try: 1, tries: 1, ms: 1840, ttft: 620, status: 200, done: true } });
  apply(ok);
  await play(ok);
  if (!demoOn) return;
  await wait(700);
  if (!demoOn) return;

  // a failover: the first seat refuses, the second answers
  const f1 = frame({ r: { id: 2, agent: "codex", provider: "deepseek", model: "deepseek-v4",
    try: 1, tries: 2, ms: 640, status: 429, fail: true, done: false } });
  apply(f1);
  say("codex → deepseek 429，换下一站");
  await play(f1);
  if (!demoOn) return;
  await wait(300);
  if (!demoOn) return;
  const f2 = frame({ r: { id: 2, agent: "codex", provider: "openai", model: "gpt-6",
    try: 2, tries: 2, moved: true, ms: 2210, ttft: 480, status: 200, done: true } });
  apply(f2);
  say("codex → openai 应答");
  await play(f2);
  if (!demoOn) return;
  await wait(500);
  if (!demoOn) return;
  // a context window filling up
  say("上下文填到 92%");
  const f3 = frame({ r: { id: 3, agent: "gemini", provider: "google", model: "gemini-3-pro",
    try: 1, tries: 1, ms: 990, status: 200, done: true },
    c: { tok: 920000, win: 1000000, cache: 700000, out: 800 },
    q: [{ n: "Gemini 天", left: 9, at: 3600 }] });
  apply(f3);
  await play(f3);
  if (demoOn) say("演示结束");
}

// --- the controls ---------------------------------------------------------
document.getElementById("play").onclick = () => {
  if (demoOn) { stopDemo(); document.getElementById("play").classList.remove("on"); }
  else { document.getElementById("play").classList.add("on"); demo(); }
};
document.getElementById("ok").onclick = () => {
  stopDemo();
  const f = frame({ r: { id: seq + 1, agent: "claude", provider: "kimi", model: "kimi-k2.5",
    try: 1, tries: 1, ms: 1840, ttft: 620, status: 200, done: true } });
  apply(f); say("一帧：成功"); play(f);
};
document.getElementById("fail").onclick = async () => {
  stopDemo();
  const id = seq + 1;
  const f1 = frame({ r: { id, agent: "codex", provider: "deepseek", model: "deepseek-v4",
    try: 1, tries: 2, ms: 640, status: 429, fail: true, done: false } });
  apply(f1); say("一帧：失败"); await play(f1);
  await wait(250);
  const f2 = frame({ r: { id, agent: "codex", provider: "openai", model: "gpt-6",
    try: 2, tries: 2, moved: true, ms: 2210, ttft: 480, status: 200, done: true } });
  apply(f2); say("一帧：换站成功"); play(f2);
};
document.getElementById("stop").onclick = () => {
  stopDemo();
  document.getElementById("play").classList.remove("on");
  say("停");
};

document.getElementById("sample").onclick = () => {
  document.getElementById("frame").value = JSON.stringify(
    frame({ r: { id: 7, agent: "claude", provider: "kimi", model: "kimi-k2.5",
      group: "opus-anywhere", try: 2, tries: 3, moved: true, ms: 1840, ttft: 620, done: false } }),
    null, 2);
};

document.getElementById("feed").onclick = () => {
  const txt = document.getElementById("frame").value.trim();
  if (!txt) { say("先粘一帧"); return; }
  let f;
  try { f = JSON.parse(txt); } catch (e) { say("这不是 JSON：" + e.message); return; }
  if (f.v > 1) say("帧版本 " + f.v + " 比这个预览新，只画认识的部分");
  if (!apply(f)) { say("旧帧，丢掉（seq " + f.seq + "）"); return; }
  say("收到 seq " + f.seq + (f.r ? " · " + f.r.agent + " → " + f.r.provider : ""));
  if (f.r) play(f);
};

// --- boot -----------------------------------------------------------------
layout();
paint();
// no frames for 45s is offline: three missed 15s heartbeats, counted here the
// way the firmware counts them
let lastFrame = Date.now();
setInterval(() => {
  const down = Date.now() - lastFrame > 45000 || state.up === 0;
  offG.setAttribute("opacity", down ? 1 : 0);
}, 500);
const origApply = apply;
apply = (f) => { const ok = origApply(f); if (ok) lastFrame = Date.now(); return ok; };
say("就绪。点「演示」，或粘一帧真实推送。");

// ?auto=1 plays the demo on load; ?frame=1 draws one sample frame and stops,
// so a screenshot and a regression check see the same thing twice.
const qp = new URLSearchParams(location.search);
if (qp.has("frame")) {
  const f = frame({ r: { id: 1, agent: "claude", provider: "kimi", model: "kimi-k2.5",
    group: "opus-anywhere", try: 2, tries: 3, moved: true, ms: 1840, ttft: 620, done: false } });
  apply(f);
  // the bird in mid-flight, where the request is at 45% of its way: a still
  // of the choreography, which is what the firmware draws every frame anyway
  pose.fly(packet(), bird("req"), [...legs.toHub(), ...legs.toSeat()], 0);
} else if (qp.has("auto")) {
  demo();
}
</script>
