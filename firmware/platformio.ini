; magpie's desk display on an M5Stack CoreS3.
;
; Board: ESP32-S3, 16MB flash, 8MB PSRAM, ILI9342C 320x240, FT6336U touch.
; Everything the display draws is in docs/protocol.md's frame; the preview in
; preview/flight.html is the design reference for the drawing and the flight.
;
;   pio run -t upload          build and flash over USB-C
;   pio device monitor         the serial log (115200)

[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
; the display is the whole point: no boot delay waiting for a serial line
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; M5Unified picks the CoreS3's own board from the board name
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
    bblanchon/ArduinoJson@^7.0.4

; the frame's parser is fixed-size on purpose: a 2048-byte body is the most
; magpie sends, and anything longer is a bug it logs rather than a reason to
; allocate
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
